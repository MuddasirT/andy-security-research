[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andy-core"
version = "0.1.0"
description = "A local-first, auditable multi-agent orchestration foundation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
andy = "andy_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
