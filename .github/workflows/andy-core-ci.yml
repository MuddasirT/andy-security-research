name: Andy Core CI

on:
  push:
    paths:
      - "ai-security-agents/andy-core/**"
      - ".github/workflows/andy-core-ci.yml"
  pull_request:
    paths:
      - "ai-security-agents/andy-core/**"
      - ".github/workflows/andy-core-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Andy Core
        run: python -m pip install -e ai-security-agents/andy-core
      - name: Run unit tests
        run: python -m unittest discover -s ai-security-agents/andy-core/tests -v
